repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
      - id: biome
        name: biome check
        language: system
        entry: npx --no-install biome check --no-errors-on-unmatched --files-ignore-unknown=true
        types_or: [ts, javascript, json]
      - id: no-html-sinks
        name: user text must not reach HTML sinks (use textContent)
        language: pygrep
        entry: '\.(innerHTML|outerHTML)\s*[+]?=|insertAdjacentHTML|document\.write'
        files: ^src/.*\.ts$
      # Every colour is a token of src/ui/themes.css, so a theme or skin can replace it.
      - id: no-colour-literals
        name: colours come from the theme tokens of themes.css
        language: pygrep
        entry: |-
          (?xi)
          ^(?!\s*(?:/\*|\*))      # not a comment line
          (?:
            .*\#[0-9a-f]{3,8}\b
          | .*\b(?:rgba?|hsla?|hwb|lab|lch|oklab|oklch)\(
            # a colour name in a property value, or on a later line of a value
          | (?:.*:[^;{}]*?|(?=[^:{}]*$).*?)
            (?<![-\w.\#])
            (?:aliceblue|antiquewhite|aqua|aquamarine|azure|beige|bisque|black|blanchedalmond|blue|blueviolet
            |brown|burlywood|cadetblue|chartreuse|chocolate|coral|cornflowerblue|cornsilk|crimson|cyan|darkblue
            |darkcyan|darkgoldenrod|darkgray|darkgreen|darkgrey|darkkhaki|darkmagenta|darkolivegreen|darkorange
            |darkorchid|darkred|darksalmon|darkseagreen|darkslateblue|darkslategray|darkslategrey|darkturquoise
            |darkviolet|deeppink|deepskyblue|dimgray|dimgrey|dodgerblue|firebrick|floralwhite|forestgreen|fuchsia
            |gainsboro|ghostwhite|gold|goldenrod|gray|green|greenyellow|grey|honeydew|hotpink|indianred|indigo
            |ivory|khaki|lavender|lavenderblush|lawngreen|lemonchiffon|lightblue|lightcoral|lightcyan
            |lightgoldenrodyellow|lightgray|lightgreen|lightgrey|lightpink|lightsalmon|lightseagreen|lightskyblue
            |lightslategray|lightslategrey|lightsteelblue|lightyellow|lime|limegreen|linen|magenta|maroon
            |mediumaquamarine|mediumblue|mediumorchid|mediumpurple|mediumseagreen|mediumslateblue
            |mediumspringgreen|mediumturquoise|mediumvioletred|midnightblue|mintcream|mistyrose|moccasin
            |navajowhite|navy|oldlace|olive|olivedrab|orange|orangered|orchid|palegoldenrod|palegreen
            |paleturquoise|palevioletred|papayawhip|peachpuff|peru|pink|plum|powderblue|purple|rebeccapurple|red
            |rosybrown|royalblue|saddlebrown|salmon|sandybrown|seagreen|seashell|sienna|silver|skyblue|slateblue
            |slategray|slategrey|snow|springgreen|steelblue|tan|teal|thistle|tomato|turquoise|violet|wheat|white
            |whitesmoke|yellow|yellowgreen
            # the system colours of the browser
            |accentcolor|accentcolortext|activetext|buttonborder|buttonface|buttontext|canvas|canvastext|field
            |fieldtext|graytext|highlight|highlighttext|linktext|mark|marktext|selecteditem|selecteditemtext
            |visitedtext)
            (?![-\w(])
          )
        files: ^src/.*\.css$
        exclude: ^src/ui/themes\.css$
      - id: typecheck
        name: tsc --noEmit
        language: system
        entry: npm run --silent typecheck
        pass_filenames: false
        types_or: [ts, json]
      - id: unit-tests
        name: vitest (unit, and browser tests in Chrome)
        language: system
        entry: npm run --silent test
        pass_filenames: false
        types_or: [ts, json]
